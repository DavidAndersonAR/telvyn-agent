# =============================================================================
# ISPWatch SNMP Profile — MikroTik RouterOS (Reference Profile)
# =============================================================================
#
# Covers ALL MikroTik RouterOS devices: CCR1036, CCR2004, RB series, hAP,
# hEX, CRS switches, CHR (Cloud Hosted Router), and future models.
#
# This is the REFERENCE profile that all other vendor profiles should follow
# for structure, naming conventions, and documentation quality.
#
# sysObjectID: 1.3.6.1.4.1.14988.1 (shared across all RouterOS devices).
# MatchSysObjectID uses prefix match, so 1.3.6.1.4.1.14988.1.* catches
# every MikroTik product running RouterOS.
#
# MIB Stack:
#   MIKROTIK-MIB       (1.3.6.1.4.1.14988.1.1.*)   — vendor-specific
#     .3   System      CPU, memory, disk, firmware
#     .3.8-.18  Health  voltages, temperatures, fan RPM (scalar, ROS 6)
#     .3.100   Health   dynamic sensor table (ROS 7+)
#     .2   Queues       simple queue + queue tree tables
#     .1   Wireless     registration table, interface stats
#   SNMPv2-MIB         (1.3.6.1.2.1.1.*)            — sysDescr, sysUpTime, etc.
#   IF-MIB             (1.3.6.1.2.1.2.2)            — ifTable (32-bit counters)
#   IF-MIB extension   (1.3.6.1.2.1.31.1.1)         — ifXTable (64-bit counters)
#   HOST-RESOURCES-MIB (1.3.6.1.2.1.25.*)           — per-core CPU, storage
#   UCD-SNMP-MIB       (1.3.6.1.4.1.2021.4.*)       — memory breakdown
#   BGP4-MIB           (1.3.6.1.2.1.15.*)           — BGP peer table
#   OSPF-MIB           (1.3.6.1.2.1.14.*)           — OSPF neighbor table
#
# Unit conventions:
#   Voltages      → millivolts (mV), e.g. 12100 = 12.1V
#   Temperatures  → deci-Celsius (ROS 6 scalars), degrees C (ROS 7 table)
#   Memory/Disk   → bytes (MIKROTIK-MIB), allocation units (HR-MIB)
#   Counters      → monotonic; UI computes rate (delta/interval)
#   ifOperStatus  → 1=up, 2=down, 3=testing, 4=unknown, 5=dormant
#   BGP peerState → 1=idle, 2=connect, 3=active, 4=opensent,
#                    5=openconfirm, 6=established
#   OSPF nbrState → 1=down, 2=attempt, 3=init, 4=2way, 5=exchstart,
#                    6=exchange, 7=loading, 8=full
#
# Naming convention for metric names:
#   mikrotik.*     → MikroTik-specific OIDs (MIKROTIK-MIB)
#   snmp.*         → standard MIB OIDs (IF-MIB, HR-MIB, BGP4-MIB, etc.)
#
# =============================================================================

sysobjectid:
  - 1.3.6.1.4.1.14988.1

# Auto-detect enabled: this profile is the generic catch-all for RouterOS.
# Model-specific profiles (e.g. mikrotik-ccr1036) set auto_detect: false
# and are selected manually in the host/check configuration.

# =============================================================================
# SCALAR METRICS (always collected, one value per poll cycle)
# =============================================================================
metrics:

  # --------------------------------------------------------------------------
  # System identification (SNMPv2-MIB)
  # --------------------------------------------------------------------------

  # sysUpTime — hundredths of seconds since last reboot. Use to detect
  # reboots (value drops) and calculate device availability.
  - mib: SNMPv2-MIB
    symbol:
      oid: 1.3.6.1.2.1.1.3.0
      name: snmp.sys.uptime

  # --------------------------------------------------------------------------
  # CPU — MIKROTIK-MIB aggregate load
  # --------------------------------------------------------------------------
  # mtxrSystemCpuLoad — aggregate CPU load percentage (0-100).
  # Single value regardless of core count. For per-core, see discovery rule.
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.1.0
      name: mikrotik.cpu.load

  # --------------------------------------------------------------------------
  # Memory — MIKROTIK-MIB
  # --------------------------------------------------------------------------
  # mtxrSystemMemoryUsed — memory used in bytes.
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.2.0
      name: mikrotik.mem.used

  # mtxrSystemMemoryTotal — total memory in bytes (not present on all FW
  # versions; if absent the collector skips silently).
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.3.0
      name: mikrotik.mem.total

  # UCD-SNMP-MIB fallback — memTotalReal / memAvailReal in KB.
  # RouterOS exposes these for compatibility. Useful to compute percentage
  # when MIKROTIK-MIB .3.3.0 is not available.
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.5.0
      name: snmp.mem.total_kb
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.6.0
      name: snmp.mem.avail_kb

  # --------------------------------------------------------------------------
  # Disk / Storage — MIKROTIK-MIB
  # --------------------------------------------------------------------------
  # mtxrSystemHddUsed / mtxrSystemHddTotal — NAND/flash usage in bytes.
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.4.0
      name: mikrotik.hdd.used
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.5.0
      name: mikrotik.hdd.total

  # --------------------------------------------------------------------------
  # Firmware version — MIKROTIK-MIB
  # --------------------------------------------------------------------------
  # mtxrFirmwareVersion (current installed firmware string).
  # Non-numeric — emitted as 0.0 by PduFloat but the raw string is
  # captured by the collector for inventory/tagging purposes.
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.7.4.0
      name: mikrotik.firmware.version

  # mtxrFirmwareUpgradeVersion — available upgrade version string.
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.7.7.0
      name: mikrotik.firmware.upgrade_version

  # --------------------------------------------------------------------------
  # License — MIKROTIK-MIB
  # --------------------------------------------------------------------------
  # mtxrLicVersion — license level (0=free, 1=p1, ..., 6=controller).
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.4.3.0
      name: mikrotik.license.level

  # --------------------------------------------------------------------------
  # Health sensors — scalars (RouterOS 6, legacy)
  # --------------------------------------------------------------------------
  # These OIDs are present on CCR, RB4011, RB3011 and similar platforms
  # running RouterOS 6.x. On RouterOS 7.x+ they may return NoSuchObject
  # (handled gracefully — the dynamic health table below covers ROS 7).

  # Voltages in millivolts
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.8.0
      name: mikrotik.health.voltage_core_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.9.0
      name: mikrotik.health.voltage_3v3_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.10.0
      name: mikrotik.health.voltage_5v_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.11.0
      name: mikrotik.health.voltage_12v_mv

  # Temperatures in deci-Celsius (e.g. 425 = 42.5 C)
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.12.0
      name: mikrotik.health.temp_sensor_dc
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.13.0
      name: mikrotik.health.temp_cpu_dc
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.14.0
      name: mikrotik.health.temp_board_dc

  # Fan speed in RPM (0 = no fan or fan stopped)
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.17.0
      name: mikrotik.health.fan_1_rpm
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.18.0
      name: mikrotik.health.fan_2_rpm

  # Board voltage in deci-volts (e.g. 245 = 24.5V)
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.15.0
      name: mikrotik.health.voltage_psu_dv

  # Power consumption in deci-watts (CCR2004 and similar)
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.16.0
      name: mikrotik.health.power_consumption_dw

  # --------------------------------------------------------------------------
  # Interface tables (IF-MIB) — table-style metrics
  # --------------------------------------------------------------------------

  # Interfaces — tráfego via ifXTable (64-bit HC counters).
  # Pkt counters (unicast/mcast/bcast) e discards removidos pra manter enxuto.
  - mib: IF-MIB
    table:
      oid: 1.3.6.1.2.1.31.1.1
      name: ifXTable
    symbols:
      - { oid: 1.3.6.1.2.1.31.1.1.1.6,  name: snmp.if.in_octets }       # ifHCInOctets
      - { oid: 1.3.6.1.2.1.31.1.1.1.10, name: snmp.if.out_octets }      # ifHCOutOctets
      - { oid: 1.3.6.1.2.1.31.1.1.1.15, name: snmp.if.high_speed }      # ifHighSpeed (Mbps)
    metric_tags:
      - { tag: interface_name,  symbol: { oid: 1.3.6.1.2.1.31.1.1.1.1,  name: ifName } }
      - { tag: interface_alias, symbol: { oid: 1.3.6.1.2.1.31.1.1.1.18, name: ifAlias } }

  # ifTable (1.3.6.1.2.1.2.2) — status operacional, tipo e errors.
  # Bloco SEPARADO porque o collector só anda na subárvore da tabela declarada;
  # OIDs da ifTable dentro do bloco ifXTable eram silenciosamente ignorados.
  # Mesmo ifIndex que a ifXTable → join por row_index com as métricas de octets.
  # interface_name vem de ifDescr (= ifName no RouterOS/Fortigate).
  # ifType (IANAifType): tunnel=131 → sinal pra classificar VPN/túnel.
  # ifOperStatus: 1=up, 2=down, 3=testing, 4=unknown, 5=dormant.
  - mib: IF-MIB
    table:
      oid: 1.3.6.1.2.1.2.2
      name: ifTable
    symbols:
      - { oid: 1.3.6.1.2.1.2.2.1.8,  name: snmp.if.oper_status }   # ifOperStatus (1=up,2=down)
      - { oid: 1.3.6.1.2.1.2.2.1.7,  name: snmp.if.admin_status }  # ifAdminStatus (1=up,2=down) — intencional vs falha
      - { oid: 1.3.6.1.2.1.2.2.1.3,  name: snmp.if.type }          # ifType (IANAifType)
      - { oid: 1.3.6.1.2.1.2.2.1.14, name: snmp.if.in_errors }     # ifInErrors
      - { oid: 1.3.6.1.2.1.2.2.1.20, name: snmp.if.out_errors }    # ifOutErrors
    metric_tags:
      - { tag: interface_name, symbol: { oid: 1.3.6.1.2.1.2.2.1.2, name: ifDescr } }

  # --------------------------------------------------------------------------
  # BGP4-MIB — BGP peer table (standard MIB, RouterOS exposes it)
  # --------------------------------------------------------------------------
  # peerState: 6=established (healthy), anything else = problem.
  # peerAdminStatus: 1=stop, 2=start.
  # Indexed by remote peer IP address.
  - mib: BGP4-MIB
    table:
      oid: 1.3.6.1.2.1.15.3
      name: bgpPeerTable
    symbols:
      - { oid: 1.3.6.1.2.1.15.3.1.2,  name: snmp.bgp.peer_state }
      - { oid: 1.3.6.1.2.1.15.3.1.3,  name: snmp.bgp.admin_status }
      - { oid: 1.3.6.1.2.1.15.3.1.9,  name: snmp.bgp.remote_as }
      - { oid: 1.3.6.1.2.1.15.3.1.16, name: snmp.bgp.fsm_established_time }
    metric_tags:
      - { tag: bgp_peer, symbol: { oid: 1.3.6.1.2.1.15.3.1.7, name: bgpPeerRemoteAddr } }

  # --------------------------------------------------------------------------
  # OSPF-MIB — OSPF neighbor table
  # --------------------------------------------------------------------------
  # nbrState: 8=full (healthy adjacency).
  # Indexed by neighbor IP + address-less index.
  - mib: OSPF-MIB
    table:
      oid: 1.3.6.1.2.1.14.10
      name: ospfNbrTable
    symbols:
      - { oid: 1.3.6.1.2.1.14.10.1.6, name: snmp.ospf.nbr_state }
    metric_tags:
      - { tag: ospf_neighbor, symbol: { oid: 1.3.6.1.2.1.14.10.1.1, name: ospfNbrIpAddr } }
      - { tag: ospf_nbr_router_id, symbol: { oid: 1.3.6.1.2.1.14.10.1.3, name: ospfNbrRtrId } }

  # OSPF area table — SPF runs and LSA counts per area.
  - mib: OSPF-MIB
    table:
      oid: 1.3.6.1.2.1.14.2
      name: ospfAreaTable
    symbols:
      - { oid: 1.3.6.1.2.1.14.2.1.4,  name: snmp.ospf.spf_runs }
      - { oid: 1.3.6.1.2.1.14.2.1.7,  name: snmp.ospf.area_lsa_count }
    metric_tags:
      - { tag: ospf_area_id, symbol: { oid: 1.3.6.1.2.1.14.2.1.1, name: ospfAreaId } }

# =============================================================================
# DISCOVERY RULES (keys for labels + items for metrics, join
# by row_index). Used for tables where the newer discovery_rules format
# provides cleaner key/item separation than the table+symbols format.
# =============================================================================
discovery_rules:

  # --------------------------------------------------------------------------
  # Per-core CPU load — HOST-RESOURCES-MIB::hrProcessorTable
  # --------------------------------------------------------------------------
  # Each row = one CPU core. row_index auto-injected by collector.
  # hrProcessorFrwID returns "0.0" on RouterOS (not useful as ID), so no keys.
  - name: cpu
    items:
      - { name: snmp.hr.processor_load, oid: 1.3.6.1.2.1.25.3.3.1.2 }

  # --------------------------------------------------------------------------
  # Storage — HOST-RESOURCES-MIB::hrStorageTable
  # --------------------------------------------------------------------------
  # Rows: "main memory", "disk1" (NAND flash), "system disk", etc.
  # Multiply storage_size/storage_used by storage_units to get bytes.
  - name: storage
    keys:
      - { label: storage_descr, oid: 1.3.6.1.2.1.25.2.3.1.3 }
      - { label: storage_units, oid: 1.3.6.1.2.1.25.2.3.1.4 }
    items:
      - { name: snmp.hr.storage_size, oid: 1.3.6.1.2.1.25.2.3.1.5 }
      - { name: snmp.hr.storage_used, oid: 1.3.6.1.2.1.25.2.3.1.6 }

  # --------------------------------------------------------------------------
  # Health sensors — dynamic table (RouterOS 7+)
  # --------------------------------------------------------------------------
  # MIKROTIK-MIB::mtxrHlTable (.3.100). Each row has:
  #   .100.1.2 = sensor name string ("cpu-temperature", "board-temperature",
  #              "fan1-speed", "voltage", "current", "power-consumption", etc.)
  #   .100.1.3 = sensor value (integer, unit depends on sensor name)
  #   .100.1.4 = sensor type (1=voltage, 2=temperature, 3=current, 4=speed,
  #              5=power, 6=fan)
  # This replaces the scalar health OIDs (.3.8-.18) on RouterOS 7+.
  # Both are polled; the collector/UI uses whichever responds.
  - name: mikrotik_health_v7
    keys:
      - { label: sensor_name, oid: 1.3.6.1.4.1.14988.1.1.3.100.1.2 }
    items:
      - { name: mikrotik.health.sensor_value, oid: 1.3.6.1.4.1.14988.1.1.3.100.1.3 }
      - { name: mikrotik.health.sensor_type,  oid: 1.3.6.1.4.1.14988.1.1.3.100.1.4 }

  # --------------------------------------------------------------------------
  # Simple Queues — MIKROTIK-MIB::mtxrQueueSimpleTable
  # --------------------------------------------------------------------------
  # 1.3.6.1.4.1.14988.1.1.2.1 = mtxrQueueSimpleTable
  #   .1.2  = queue name (string)
  #   .1.8  = bytes in (Counter64)
  #   .1.9  = bytes out (Counter64)
  #   .1.10 = packets in (Counter64)
  #   .1.11 = packets out (Counter64)
  #   .1.12 = queued bytes in
  #   .1.13 = queued bytes out
  - name: mikrotik_simple_queues
    keys:
      - { label: queue_name, oid: 1.3.6.1.4.1.14988.1.1.2.1.1.2 }
    items:
      - { name: mikrotik.queue.simple.bytes_in,   oid: 1.3.6.1.4.1.14988.1.1.2.1.1.8 }
      - { name: mikrotik.queue.simple.bytes_out,   oid: 1.3.6.1.4.1.14988.1.1.2.1.1.9 }
      - { name: mikrotik.queue.simple.packets_in,  oid: 1.3.6.1.4.1.14988.1.1.2.1.1.10 }
      - { name: mikrotik.queue.simple.packets_out, oid: 1.3.6.1.4.1.14988.1.1.2.1.1.11 }
    static_tags:
      queue_type: simple

  # --------------------------------------------------------------------------
  # Queue Tree — MIKROTIK-MIB::mtxrQueueTreeTable
  # --------------------------------------------------------------------------
  # 1.3.6.1.4.1.14988.1.1.2.2 = mtxrQueueTreeTable
  #   .1.2  = queue name (string)
  #   .1.6  = packets (Counter64)
  #   .1.7  = bytes (Counter64, HC)
  #   .1.9  = dropped packets
  - name: mikrotik_queue_tree
    keys:
      - { label: queue_name, oid: 1.3.6.1.4.1.14988.1.1.2.2.1.2 }
    items:
      - { name: mikrotik.queue.tree.bytes,   oid: 1.3.6.1.4.1.14988.1.1.2.2.1.7 }
      - { name: mikrotik.queue.tree.packets, oid: 1.3.6.1.4.1.14988.1.1.2.2.1.6 }
      - { name: mikrotik.queue.tree.dropped, oid: 1.3.6.1.4.1.14988.1.1.2.2.1.9 }
    static_tags:
      queue_type: tree

  # --------------------------------------------------------------------------
  # Wireless Registration Table — MIKROTIK-MIB::mtxrWlRtabTable
  # --------------------------------------------------------------------------
  # 1.3.6.1.4.1.14988.1.1.1.2 = mtxrWlRtabTable (connected clients)
  #   .1.1  = MAC address (OctetString)
  #   .1.3  = signal strength (dBm, Integer32, negative)
  #   .1.4  = tx bytes (Counter32)
  #   .1.5  = rx bytes (Counter32)
  #   .1.8  = tx rate (bps)
  #   .1.9  = rx rate (bps)
  #   .1.11 = uptime (TimeTicks)
  #   .1.12 = noise floor (dBm)
  # Only populated on devices with wireless interfaces (hAP, wAP, RB series
  # with wireless cards). Empty table on wired-only devices (CCR, CRS) —
  # walk returns zero rows, no error.
  - name: mikrotik_wireless_clients
    keys:
      - { label: client_mac, oid: 1.3.6.1.4.1.14988.1.1.1.2.1.1 }
    items:
      - { name: mikrotik.wireless.signal_dbm,      oid: 1.3.6.1.4.1.14988.1.1.1.2.1.3 }
      - { name: mikrotik.wireless.tx_bytes,         oid: 1.3.6.1.4.1.14988.1.1.1.2.1.4 }
      - { name: mikrotik.wireless.rx_bytes,         oid: 1.3.6.1.4.1.14988.1.1.1.2.1.5 }
      - { name: mikrotik.wireless.tx_rate_bps,      oid: 1.3.6.1.4.1.14988.1.1.1.2.1.8 }
      - { name: mikrotik.wireless.rx_rate_bps,      oid: 1.3.6.1.4.1.14988.1.1.1.2.1.9 }
      - { name: mikrotik.wireless.client_uptime,    oid: 1.3.6.1.4.1.14988.1.1.1.2.1.11 }
      - { name: mikrotik.wireless.noise_floor_dbm,  oid: 1.3.6.1.4.1.14988.1.1.1.2.1.12 }
    static_tags:
      subsystem: wireless

  # --------------------------------------------------------------------------
  # Wireless Interface Stats — MIKROTIK-MIB::mtxrWlApTable
  # --------------------------------------------------------------------------
  # 1.3.6.1.4.1.14988.1.1.1.3 = mtxrWlApTable (AP interface stats)
  #   .1.1  = interface index
  #   .1.2  = SSID (OctetString)
  #   .1.4  = band (string, e.g. "2ghz-b/g/n")
  #   .1.5  = frequency (MHz)
  #   .1.6  = client count (Integer32)
  #   .1.7  = noise floor (dBm)
  - name: mikrotik_wireless_interfaces
    keys:
      - { label: wlan_ssid,      oid: 1.3.6.1.4.1.14988.1.1.1.3.1.2 }
      - { label: wlan_band,      oid: 1.3.6.1.4.1.14988.1.1.1.3.1.4 }
    items:
      - { name: mikrotik.wireless.ap.frequency_mhz,  oid: 1.3.6.1.4.1.14988.1.1.1.3.1.5 }
      - { name: mikrotik.wireless.ap.client_count,    oid: 1.3.6.1.4.1.14988.1.1.1.3.1.6 }
      - { name: mikrotik.wireless.ap.noise_floor_dbm, oid: 1.3.6.1.4.1.14988.1.1.1.3.1.7 }
    static_tags:
      subsystem: wireless

  # --------------------------------------------------------------------------
  # DHCP Server Leases — MIKROTIK-MIB::mtxrDHCPLeaseTable
  # --------------------------------------------------------------------------
  # 1.3.6.1.4.1.14988.1.1.8 = DHCP subtree
  #   .1    = mtxrDHCPLeaseCount (scalar — total active leases)
  # Note: the lease count is a scalar but we collect it via discovery_rules
  # as a single-row walk since that also tests reachability of the subtree.
  # For detailed per-lease data RouterOS API is needed (deferred).
  #
  # FUTURE: Per-lease table walk when MIB support is verified on target FW.

# =============================================================================
# STATIC TAGS — applied to ALL metrics from this profile
# =============================================================================
metric_tags:
  - { tag: vendor,        value: mikrotik }
  - { tag: os,            value: routeros }
  - { tag: device_role,   value: router }
  - { tag: profile,       value: mikrotik-routeros }

# =============================================================================
# TRIGGERS (alert conditions)
# =============================================================================
#
# FUTURE: The Go parser does not yet support a `triggers:` section. When
# implemented, the structure below should be used. Until then, these are
# configured via the ISPWatch alert rules engine (backend API).
#
# triggers:
#
#   # --- CPU ---
#   - name: mikrotik.cpu.high
#     description: "CPU load > 90% for 5 minutes"
#     expression: "avg(mikrotik.cpu.load, 5m) > 90"
#     severity: P2
#     tags: { subsystem: cpu }
#
#   # --- Memory ---
