# IspWatch SNMP profile — linux-net-snmp. Schema reference: RESEARCH.md Pattern 1.
#
# Cobre hosts Linux rodando net-snmp (snmpd) — sysObjectID 1.3.6.1.4.1.8072.3.2.10.
# Stack OID alvo: UCD-SNMP-MIB (load, mem, cpu), IF-MIB (interface counters).

sysobjectid:
  - 1.3.6.1.4.1.8072.3.2.10

metrics:
  # Load average — UCD-SNMP-MIB::laTable (.1.3.6.1.4.1.2021.10.1.3.<n>)
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.10.1.3.1
      name: snmp.load.1
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.10.1.3.2
      name: snmp.load.5
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.10.1.3.3
      name: snmp.load.15

  # Memoria — UCD-SNMP-MIB::memory (.1.3.6.1.4.1.2021.4)
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.5.0
      name: snmp.mem.total
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.6.0
      name: snmp.mem.avail
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.11.0
      name: snmp.mem.swap_avail

  # CPU agregada — UCD-SNMP-MIB::systemStats (.1.3.6.1.4.1.2021.11)
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.11.10.0
      name: snmp.cpu.user
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.11.11.0
      name: snmp.cpu.idle

  # CPU por core — HOST-RESOURCES-MIB::hrProcessorTable
  # (1.3.6.1.2.1.25.3.3) — 1 row por CPU lógica, indexado por hrDeviceIndex.
  # Não definimos cpu_index aqui: hrDeviceDescr está em outra tabela
  # (.25.3.2) fora do walk, e mesmo quando resolve costuma vir idêntico
  # ("GenuineIntel: ...") pros 36 cores. O collector já injeta row_index
  # automático na rowTags — é o que o frontend usa pra separar os cards.
  - mib: HOST-RESOURCES-MIB
    table:
      oid: 1.3.6.1.2.1.25.3.3
      name: hrProcessorTable
    symbols:
      - { oid: 1.3.6.1.2.1.25.3.3.1.2, name: snmp.hr.processor_load }

  # IF-MIB ifTable (1.3.6.1.2.1.2.2) — interface counters por linha,
  # com tag interface_name resolvendo ifDescr na mesma row.
  - mib: IF-MIB
    table:
      oid: 1.3.6.1.2.1.2.2
      name: ifTable
    symbols:
      - { oid: 1.3.6.1.2.1.2.2.1.10, name: snmp.if.in_octets }
      - { oid: 1.3.6.1.2.1.2.2.1.16, name: snmp.if.out_octets }
      - { oid: 1.3.6.1.2.1.2.2.1.14, name: snmp.if.in_errors }
      - { oid: 1.3.6.1.2.1.2.2.1.20, name: snmp.if.out_errors }
      - { oid: 1.3.6.1.2.1.2.2.1.8,  name: snmp.if.oper_status }
    metric_tags:
      - { tag: interface_name, symbol: { oid: 1.3.6.1.2.1.2.2.1.2, name: ifDescr } }

metric_tags:
  - { tag: vendor, value: linux-net-snmp }
  - { tag: device_role, value: server }
