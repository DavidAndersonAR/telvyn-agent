# Perfil SNMP — Mikrotik CCR1036 (community templates).
# Cobre: sistema (uptime/CPU/memória/disco), health (voltagens/temperaturas/fans),
# interfaces (octets, errors, discards, status, speed) com nomes reais.
#
# Schema: novo (discovery_rules pra tabelas + metrics escalares pra sistema).

sysobjectid:
- 1.3.6.1.4.1.0

metadata:
  device:
    vendor:        { value: mikrotik }
    type:          { value: router }
    model:         { value: CCR1036-8G-2S }
    os_name:       { value: RouterOS }
    serial_number: { symbol: { oid: 1.3.6.1.4.1.14988.1.1.7.3.0, name: mtxrSerialNumber } }
    version:       { symbol: { oid: 1.3.6.1.4.1.14988.1.1.7.4.0, name: mtxrFirmwareVersion } }
    sys_object_id: { symbol: { oid: 1.3.6.1.2.1.1.2.0, name: sysObjectID } }

metrics:
# ---- Sistema (MIKROTIK-MIB Health/System subtree) ----
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.1.0,  name: mikrotik.cpu.load }       # CPU load 1min (%)
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.2.0,  name: mikrotik.mem.used }       # memory used (bytes)
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.4.0,  name: mikrotik.hdd.used }       # disk used (bytes)
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.5.0,  name: mikrotik.hdd.total }      # disk total (bytes)

# ---- Uptime (sysUpTime, universal) ----
- mib: SNMPv2-MIB
  symbol: { oid: 1.3.6.1.2.1.1.3.0, name: snmp.sys.uptime }

# ---- Health: voltagens (mV), temperaturas (deci-Celsius), fans (RPM) ----
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.8.0,  name: mikrotik.health.voltage_core_mv }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.9.0,  name: mikrotik.health.voltage_3v3_mv }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.10.0, name: mikrotik.health.voltage_5v_mv }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.11.0, name: mikrotik.health.voltage_12v_mv }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.12.0, name: mikrotik.health.temp_sensor_dc }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.13.0, name: mikrotik.health.temp_cpu_dc }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.14.0, name: mikrotik.health.temp_board_dc }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.17.0, name: mikrotik.health.fan_1_rpm }
- mib: MIKROTIK-MIB
  symbol: { oid: 1.3.6.1.4.1.14988.1.1.3.18.0, name: mikrotik.health.fan_2_rpm }

discovery_rules:
# CPU por core — HOST-RESOURCES-MIB::hrProcessorTable
# Sem `keys`: hrProcessorFrwID retorna sempre "0.0" no Mikrotik (não serve
# como ID). row_index é auto-injetado e basta pra distinguir os cores.
- name: cpu
  items:
  - { name: snmp.hr.processor_load, oid: 1.3.6.1.2.1.25.3.3.1.2 }

# Memória e disco — HOST-RESOURCES-MIB::hrStorageTable
# row_index identifica cada entrada; storage_descr é o nome humano (e.g. "main memory")
- name: storage
  keys:
  - { label: storage_descr, oid: 1.3.6.1.2.1.25.2.3.1.3 }
  - { label: storage_units, oid: 1.3.6.1.2.1.25.2.3.1.4 }
  items:
  - { name: snmp.hr.storage_size, oid: 1.3.6.1.2.1.25.2.3.1.5 }
  - { name: snmp.hr.storage_used, oid: 1.3.6.1.2.1.25.2.3.1.6 }

# Health table dinâmica RouterOS 7+ (subtree .100)
# Cada row tem .2 = nome ("cpu-temperature", "fan1-speed", ...), .3 = valor
- name: mikrotik_health_v7
  keys:
  - { label: sensor_name, oid: 1.3.6.1.4.1.14988.1.1.3.100.1.2 }
  items:
  - { name: mikrotik.health.sensor_value, oid: 1.3.6.1.4.1.14988.1.1.3.100.1.3 }

- name: interfaces
  keys:
  - { label: interface_name,  oid: 1.3.6.1.2.1.31.1.1.1.1 }   # ifName
  - { label: interface_descr, oid: 1.3.6.1.2.1.2.2.1.2 }      # ifDescr
  - { label: interface_alias, oid: 1.3.6.1.2.1.31.1.1.1.18 }  # ifAlias
  items:
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_in,           oid: 1.3.6.1.2.1.31.1.1.1.6  }  # ifHCInOctets
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_out,          oid: 1.3.6.1.2.1.31.1.1.1.10 }  # ifHCOutOctets
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_speed,        oid: 1.3.6.1.2.1.31.1.1.1.15 }  # ifHighSpeed
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_in_discards,  oid: 1.3.6.1.2.1.2.2.1.13    }
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_in_errors,    oid: 1.3.6.1.2.1.2.2.1.14    }
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_out_discards, oid: 1.3.6.1.2.1.2.2.1.19    }
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_out_errors,   oid: 1.3.6.1.2.1.2.2.1.20    }
  - { name: community.mikrotik_aa_snmp_mikrotik_ccr_1036.net_if_status,       oid: 1.3.6.1.2.1.2.2.1.8     }
  static_tags:
    template_table: net-if-discovery

metric_tags:
- { tag: vendor,           value: mikrotik }
- { tag: template,         value: aa-snmp-mikrotik-ccr-1036 }
- { tag: template_version, value: 6-0 }
