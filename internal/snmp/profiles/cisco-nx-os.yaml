# IspWatch SNMP profile — cisco-nx-os. Schema reference: RESEARCH.md Pattern 1.
#
# Cobre Cisco Nexus rodando NX-OS — sysObjectID prefix 1.3.6.1.4.1.9.12.3.1.3.*.
# Esse prefix e mais especifico que cisco-ios (1.3.6.1.4.1.9.1.*) entao o
# MatchSysObjectID resolve este primeiro para Nexus 7k/9k/3k.
#
# Stack OID: CISCO-PROCESS-MIB (cpu), IF-MIB, BGP4-MIB.

sysobjectid:
  - 1.3.6.1.4.1.9.12.3.1.3

metrics:
  - mib: CISCO-PROCESS-MIB
    symbol:
      oid: 1.3.6.1.4.1.9.9.109.1.1.1.1.5
      name: cisco.cpu.5min

  - mib: IF-MIB
    table:
      oid: 1.3.6.1.2.1.2.2
      name: ifTable
    symbols:
      - { oid: 1.3.6.1.2.1.2.2.1.10, name: snmp.if.in_octets }
      - { oid: 1.3.6.1.2.1.2.2.1.16, name: snmp.if.out_octets }
      - { oid: 1.3.6.1.2.1.2.2.1.14, name: snmp.if.in_errors }
      - { oid: 1.3.6.1.2.1.2.2.1.20, name: snmp.if.out_errors }
      - { oid: 1.3.6.1.2.1.2.2.1.8,  name: snmp.if.oper_status }
    metric_tags:
      - { tag: interface_name, symbol: { oid: 1.3.6.1.2.1.2.2.1.2, name: ifDescr } }

  - mib: BGP4-MIB
    table:
      oid: 1.3.6.1.2.1.15.3
      name: bgpPeerTable
    symbols:
      - { oid: 1.3.6.1.2.1.15.3.1.2, name: snmp.bgp.peer_state }
    metric_tags:
      - { tag: bgp_peer, symbol: { oid: 1.3.6.1.2.1.15.3.1.7, name: bgpPeerRemoteAddr } }

metric_tags:
  - { tag: vendor, value: cisco-nx-os }
  - { tag: device_role, value: switch }
