# IspWatch SNMP profile — MikroTik CCR1036-8G-2S (Cloud Core Router).
#
# Modelo: 36 cores ARM Tilera Tile-Gx Pro, 4 GB RAM, 2 SFP 1G, 8 Gigabit Ethernet,
# 2 coolers monitorados, sensores de temperatura CPU/board/ambiente,
# rails de voltagem core/3.3V/5V/12V.
#
# sysObjectID: 1.3.6.1.4.1.14988.1 (compartilhado com toda linha RouterOS).
# Seleção é manual via UI; o operador escolhe explicitamente este perfil
# para tirar proveito dos sensores de hardware específicos do CCR.
#
# Stack OID:
#   MIKROTIK-MIB (1.3.6.1.4.1.14988.1.1.3.*)
#     subárvore Health (.8-.18): voltagens, temperaturas, fan RPM
#     subárvore System (.1-.5): CPU, memória, disco
#   IF-MIB (1.3.6.1.2.1.2.2): interfaces 32-bit counters
#   IF-MIB extension (1.3.6.1.2.1.31.1.1): interfaces 64-bit counters (gigabit)
#   BGP4-MIB (1.3.6.1.2.1.15.3): peers BGP padrão

sysobjectid:
  - 1.3.6.1.4.1.14988.1

# RouterOS reutiliza o mesmo sysObjectID em vários modelos. Este profile é
# específico de CCR1036 e deve ser escolhido manualmente no host/check.
auto_detect: false

metadata:
  device:
    vendor:        { value: mikrotik }
    type:          { value: router }
    model:         { value: CCR1036 }
    os_name:       { value: RouterOS }
    serial_number: { symbol: { oid: 1.3.6.1.4.1.14988.1.1.7.3.0, name: mtxrSerialNumber } }
    version:       { symbol: { oid: 1.3.6.1.4.1.14988.1.1.7.4.0, name: mtxrFirmwareVersion } }
    sys_object_id: { symbol: { oid: 1.3.6.1.2.1.1.2.0, name: sysObjectID } }

metrics:
  # ---- Sistema ----
  # Subárvore MIKROTIK-MIB Health/System (alguns devices restringem via ACL).
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.1.0
      name: mikrotik.cpu.load
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.2.0
      name: mikrotik.mem.used
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.4.0
      name: mikrotik.hdd.used
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.5.0
      name: mikrotik.hdd.total

  # ---- Fallbacks padrão (HOST-RESOURCES-MIB) ----
  # CPU load via hrProcessorTable — 1 row por core. row_index é injetado
  # automaticamente pelo collector (unicidade garantida); não definimos
  # cpu_index aqui porque a única coluna útil dessa tabela é o próprio
  # load (não serve como identificador).
  - mib: HOST-RESOURCES-MIB
    table:
      oid: 1.3.6.1.2.1.25.3.3
      name: hrProcessorTable
    symbols:
      - { oid: 1.3.6.1.2.1.25.3.3.1.2, name: snmp.hr.processor_load }

  # Memória via UCD-SNMP-MIB (memTotalReal, memAvailReal, etc.).
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.5.0
      name: snmp.mem.total_kb
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.6.0
      name: snmp.mem.avail_kb
  - mib: UCD-SNMP-MIB
    symbol:
      oid: 1.3.6.1.4.1.2021.4.11.0
      name: snmp.mem.total_free_kb

  # Uptime (sysUpTime) — universal.
  - mib: SNMPv2-MIB
    symbol:
      oid: 1.3.6.1.2.1.1.3.0
      name: snmp.sys.uptime

  # ---- Sensores de Hardware (Health subtree) ----
  # Voltagens em mV (e.g., 12100 = 12.1V). Coolers em RPM.
  # Temperaturas em deci-Celsius (e.g., 425 = 42.5°C).
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.8.0
      name: mikrotik.health.voltage_core_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.9.0
      name: mikrotik.health.voltage_3v3_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.10.0
      name: mikrotik.health.voltage_5v_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.11.0
      name: mikrotik.health.voltage_12v_mv
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.12.0
      name: mikrotik.health.temp_sensor_dc
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.13.0
      name: mikrotik.health.temp_cpu_dc
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.14.0
      name: mikrotik.health.temp_board_dc
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.17.0
      name: mikrotik.health.fan_1_rpm
  - mib: MIKROTIK-MIB
    symbol:
      oid: 1.3.6.1.4.1.14988.1.1.3.18.0
      name: mikrotik.health.fan_2_rpm

  # ---- Interfaces — 32-bit (ifTable) ----
  - mib: IF-MIB
    table:
      oid: 1.3.6.1.2.1.2.2
      name: ifTable
    symbols:
      - { oid: 1.3.6.1.2.1.2.2.1.5,  name: snmp.if.speed }
      - { oid: 1.3.6.1.2.1.2.2.1.8,  name: snmp.if.oper_status }
      - { oid: 1.3.6.1.2.1.2.2.1.14, name: snmp.if.in_errors }
      - { oid: 1.3.6.1.2.1.2.2.1.20, name: snmp.if.out_errors }
      - { oid: 1.3.6.1.2.1.2.2.1.13, name: snmp.if.in_discards }
      - { oid: 1.3.6.1.2.1.2.2.1.19, name: snmp.if.out_discards }
    metric_tags:
      - { tag: interface_name, symbol: { oid: 1.3.6.1.2.1.2.2.1.2, name: ifDescr } }

  # ---- Interfaces — 64-bit (ifXTable) — critico para 1G+ sem overflow ----
  - mib: IF-MIB
    table:
      oid: 1.3.6.1.2.1.31.1.1
      name: ifXTable
    symbols:
      - { oid: 1.3.6.1.2.1.31.1.1.1.6,  name: snmp.if.in_octets }
      - { oid: 1.3.6.1.2.1.31.1.1.1.10, name: snmp.if.out_octets }
      - { oid: 1.3.6.1.2.1.31.1.1.1.7,  name: snmp.if.in_ucast_pkts }
      - { oid: 1.3.6.1.2.1.31.1.1.1.11, name: snmp.if.out_ucast_pkts }
      - { oid: 1.3.6.1.2.1.31.1.1.1.15, name: snmp.if.high_speed }
    metric_tags:
      - { tag: interface_name, symbol: { oid: 1.3.6.1.2.1.31.1.1.1.1, name: ifName } }

  # ---- BGP peers ----
  - mib: BGP4-MIB
    table:
      oid: 1.3.6.1.2.1.15.3
      name: bgpPeerTable
    symbols:
      - { oid: 1.3.6.1.2.1.15.3.1.2, name: snmp.bgp.peer_state }
      - { oid: 1.3.6.1.2.1.15.3.1.3, name: snmp.bgp.admin_status }
    metric_tags:
      - { tag: bgp_peer, symbol: { oid: 1.3.6.1.2.1.15.3.1.7, name: bgpPeerRemoteAddr } }

metric_tags:
  - { tag: vendor,        value: mikrotik }
  - { tag: device_role,   value: router }
  - { tag: device_model,  value: CCR1036-8G-2S }
  - { tag: device_family, value: cloud-core-router }
