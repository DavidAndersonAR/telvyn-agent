# IspWatch Agent configuration
# This file is generated by install.sh from the bundled template.
# Placeholders __ENROLL_TOKEN__ / __SITE__ / __HOSTNAME__ are replaced
# with values from ISPWATCH_* environment variables during install.
#
# Initial enrollment exchange (TODO Plan 09 release) trades enroll_token
# for an mTLS cert via the Quarkus enrollment endpoint. Until Plan 09
# lands, this file is staged on disk and the running agent still reads
# its operational config from CLI flags (see internal/config/config.go).

agent:
  hostname: __HOSTNAME__

control_plane:
  site: __SITE__
  enroll_token: __ENROLL_TOKEN__
  # Caminhos esperados após a enrollment exchange (Plan 09).
  mtls_cert: /etc/ispwatch/certs/agent.crt
  mtls_key: /etc/ispwatch/certs/agent.key
  mtls_ca: /etc/ispwatch/certs/ca.crt

wal:
  path: /var/lib/ispwatch/wal.db
  max_size_mb: 1024

log:
  level: info
