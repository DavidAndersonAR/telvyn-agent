apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}
  labels:
    {{- include "ispwatch-agent.labels" . | nindent 4 }}
rules:
  # Kubelet stats/summary + metrics endpoints. The agent talks to the local
  # kubelet (localhost:10250 when hostNetwork=true) which auths via the
  # ServiceAccount token + verifies these RBAC rules.
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/proxy
      - nodes/metrics
    verbs: ["get"]
  # Pod metadata — used for auto-tagging containers with deployment/owner refs.
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - namespaces
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}
  labels:
    {{- include "ispwatch-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ispwatch-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ispwatch-agent.fullname" . }}
    namespace: {{ .Release.Namespace }}
