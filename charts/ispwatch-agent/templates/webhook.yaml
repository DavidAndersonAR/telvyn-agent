{{- if .Values.webhook.enabled }}
{{- /*
  Mutating Webhook stack (auto-injeção do -javaagent por admission controller
  controller):
   - Issuer selfSigned + Certificate (cert-manager) → Secret webhook-tls; o
     cainjector preenche o caBundle do MutatingWebhookConfiguration via a
     annotation cert-manager.io/inject-ca-from. (cert-manager é pré-requisito.)
   - Deployment: 1 réplica do agent rodando --webhook (certless/Bearer).
   - Service: ClusterIP, porta 443 → 8443.
   - MutatingWebhookConfiguration: Pod CREATE → /mutate; failurePolicy Ignore
     (se o webhook cair, pods sobem normal — tracing é nice-to-have).
*/}}
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-webhook-selfsign
  namespace: {{ .Release.Namespace }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ include "ispwatch-agent.fullname" . }}-webhook-tls
  dnsNames:
    - {{ include "ispwatch-agent.fullname" . }}-webhook
    - {{ include "ispwatch-agent.fullname" . }}-webhook.{{ .Release.Namespace }}
    - {{ include "ispwatch-agent.fullname" . }}-webhook.{{ .Release.Namespace }}.svc
    - {{ include "ispwatch-agent.fullname" . }}-webhook.{{ .Release.Namespace }}.svc.cluster.local
  issuerRef:
    name: {{ include "ispwatch-agent.fullname" . }}-webhook-selfsign
    kind: Issuer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: ispwatch-agent
    app.kubernetes.io/component: webhook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ispwatch-agent
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ispwatch-agent
        app.kubernetes.io/component: webhook
    spec:
      serviceAccountName: {{ include "ispwatch-agent.fullname" . }}
      containers:
        - name: webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Bypassa o entrypoint.sh (que escolhe modo por env e rodaria ingest):
          # roda o binário direto em modo webhook.
          command: ["/usr/local/bin/collector"]
          args: ["--webhook"]
          ports:
            - { name: https, containerPort: 8443 }
          env:
            # Certless (mesmo modelo do DaemonSet): lista de workloads vem do
            # gateway via Bearer; sem mTLS.
            - name: ISPWATCH_INGEST_URL
              value: {{ required "values.ingest.url é obrigatório p/ o webhook" .Values.ingest.url | quote }}
            - name: ISPWATCH_INGEST_TOKEN
              value: {{ required "values.ingest.token é obrigatório p/ o webhook" .Values.ingest.token | quote }}
            - name: ISPWATCH_AGENT_IMAGE
              value: {{ default (printf "%s:%s" .Values.image.repository .Values.image.tag) .Values.webhook.agentImageRef | quote }}
            - name: ISPWATCH_OTLP_ENDPOINT
              value: {{ .Values.webhook.otlpEndpoint | quote }}
            - name: ISPWATCH_OTLP_PROTOCOL
              value: {{ .Values.webhook.otlpProtocol | default "http/protobuf" | quote }}
          volumeMounts:
            - { name: tls, mountPath: /etc/ispwatch/webhook, readOnly: true }
          readinessProbe:
            httpGet: { path: /healthz, port: https, scheme: HTTPS }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      volumes:
        - name: tls
          secret:
            secretName: {{ include "ispwatch-agent.fullname" . }}-webhook-tls
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app.kubernetes.io/name: ispwatch-agent
    app.kubernetes.io/component: webhook
  ports:
    - port: {{ .Values.webhook.service.port }}
      targetPort: https
      name: https
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-webhook
  annotations:
    # cainjector preenche clientConfig.caBundle a partir do Secret da Certificate.
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "ispwatch-agent.fullname" . }}-webhook
webhooks:
  - name: javaagent.ispwatch.io
    clientConfig:
      service:
        name: {{ include "ispwatch-agent.fullname" . }}-webhook
        namespace: {{ .Release.Namespace }}
        path: /mutate
        port: {{ .Values.webhook.service.port }}
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
        scope: "Namespaced"
    {{- if .Values.webhook.namespaceSelector }}
    namespaceSelector:
{{ toYaml .Values.webhook.namespaceSelector | indent 6 }}
    {{- end }}
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 5
    # Failure policy Ignore — se webhook offline/lento, pod sobe normal.
    # Tracing é nice-to-have, não pode bloquear deploy do cliente.
    failurePolicy: Ignore
{{- end }}
