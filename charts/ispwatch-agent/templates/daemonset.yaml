apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ispwatch-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ispwatch-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ispwatch-agent.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ispwatch-agent.fullname" . }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      # Sob hostNetwork o pod herda o resolv.conf do nó e perde o DNS do
      # cluster (CoreDNS). ClusterFirstWithHostNet recupera a resolução de
      # service names (ex: backend.ispwatch.svc do enroll/gRPC) e ainda
      # resolve nomes públicos via upstream.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if .Values.ebpfTracing.enabled }}
      # eBPF L7 tracing exige hostPID pra resolver pid → container via
      # /proc do host (cgroup parsing). Sem isso o resolver vê só PIDs do
      # próprio pod, não dos workloads sendo traçados.
      hostPID: true
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ISPWATCH_CLUSTER
              value: {{ .Values.clusterName | quote }}
            {{- if .Values.ingest.url }}
            # Modo ingest certless (Datadog-style): manda OTLP+Bearer pro
            # gateway /api/ingest/v1. Sem enrollment, sem mTLS, sem cert.
            - name: ISPWATCH_INGEST_URL
              value: {{ .Values.ingest.url | quote }}
            - name: ISPWATCH_INGEST_TOKEN
              value: {{ required "values.ingest.token é obrigatório quando ingest.url está setado" .Values.ingest.token | quote }}
            {{- else }}
            - name: ISPWATCH_AGENT_KIND
              value: {{ .Values.bootstrap.agentKind | default "k8s.node" | quote }}
            # Bootstrap enrollment — entrypoint detecta esses envs e dispara
            # /api/agents/enroll na primeira inicialização do pod. Resultado
            # (cert/key/ca/identity.env) salvo no WAL emptyDir e reusado em
            # restarts subsequentes do mesmo pod.
            - name: ISPWATCH_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "values.bootstrap.tokenSecretName is required" .Values.bootstrap.tokenSecretName }}
                  key: token
            - name: ISPWATCH_ENROLL_URL
              value: {{ required "values.bootstrap.enrollUrl is required" .Values.bootstrap.enrollUrl | quote }}
            {{- if .Values.bootstrap.insecureTls }}
            - name: ISPWATCH_ENROLL_INSECURE_TLS
              value: "1"
            {{- end }}
            - name: ISPWATCH_PKI_DIR
              value: "/var/lib/ispwatch-collector/pki"
            {{- end }}
            - name: COLLECTOR_LOG_LEVEL
              value: {{ .Values.logLevel | default "info" | quote }}
            {{- if .Values.ebpfTracing.enabled }}
            - name: ISPWATCH_EBPF_TRACING
              value: "1"
            - name: ISPWATCH_KUBELET_URL
              value: {{ .Values.ebpfTracing.kubeletURL | default "https://localhost:10250" | quote }}
            - name: ISPWATCH_KUBELET_TOKEN_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: ISPWATCH_KUBELET_INSECURE
              value: {{ .Values.ebpfTracing.kubeletInsecure | default "1" | quote }}
            {{- end }}
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: wal
              mountPath: /var/lib/ispwatch-collector
            - name: tmp
              mountPath: /tmp
            {{- if .Values.ebpfTracing.enabled }}
            # eBPF precisa de /sys/kernel/debug (kprobes) + /sys/fs/bpf
            # (BPF maps persistentes). Read-only quando o kernel suporta;
            # alguns kernels antigos exigem RW pra criar tracefs events.
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- if .Values.ebpfTracing.enabled }}
            # eBPF exige privileged ou capabilities específicas. Privileged
            # é mais simples e compatível com kernel/distro diversos —
            # tradeoff: o agent já roda como hostNetwork+hostPID, escopo
            # de impacto similar.
            privileged: true
            # eBPF kprobes precisam de CAP_SYS_ADMIN, e o image USER do
            # Dockerfile (ispwatch uid 10001) não tem capabilities mesmo
            # com privileged. Override pra root só quando ebpf ativo.
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
            {{- else }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]   # ICMP ping check needs raw sockets
            {{- end }}
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: wal
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.ebpfTracing.enabled }}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        {{- end }}
