apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ispwatch-agent.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "ispwatch-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ispwatch-agent.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ispwatch-agent.fullname" . }}
      hostNetwork: {{ .Values.hostNetwork }}
      {{- if .Values.hostNetwork }}
      # Sob hostNetwork o pod herda o resolv.conf do nó e perde o DNS do
      # cluster (CoreDNS). ClusterFirstWithHostNet recupera a resolução de
      # service names (ex: o gateway de ingest in-cluster) e ainda
      # resolve nomes públicos via upstream.
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- if or .Values.ebpfTracing.enabled .Values.profiling.enabled }}
      # eBPF (L7 tracing e/ou CPU profiler) exige hostPID pra resolver
      # pid → container via /proc do host (cgroup parsing). Sem isso o
      # resolver vê só PIDs do próprio pod, não dos workloads do nó.
      hostPID: true
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ISPWATCH_CLUSTER
              value: {{ .Values.clusterName | quote }}
            # Modo ingest certless (Datadog-style): manda OTLP+Bearer pro
            # gateway /api/ingest/v1. Sem enrollment, sem mTLS, sem cert.
            - name: ISPWATCH_INGEST_URL
              value: {{ required "values.ingest.url é obrigatório (modo certless)" .Values.ingest.url | quote }}
            - name: ISPWATCH_INGEST_TOKEN
              value: {{ required "values.ingest.token é obrigatório (modo certless)" .Values.ingest.token | quote }}
            # Coleta de k8s no modo ingest: registra o nó + roda o kubelet
            # check local (pods/containers). O SA token é montado em
            # /var/run/secrets/.../token; kubelet self-signed → insecure.
            - name: ISPWATCH_AGENT_KIND
              value: "k8s.node"
            - name: ISPWATCH_KUBELET_URL
              value: "https://localhost:10250"
            - name: ISPWATCH_KUBELET_TOKEN_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: ISPWATCH_KUBELET_INSECURE
              value: "1"
            - name: COLLECTOR_LOG_LEVEL
              value: {{ .Values.logLevel | default "info" | quote }}
            {{- if .Values.logs.enabled }}
            # Coleta de logs: taila /var/log/pods (CRI) → OTLP JSON + Bearer.
            - name: ISPWATCH_LOGS_ENABLED
              value: "1"
            {{- with .Values.logs.excludeNamespaces }}
            - name: ISPWATCH_LOGS_EXCLUDE_NAMESPACES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.ebpfTracing.enabled }}
            - name: ISPWATCH_EBPF_TRACING
              value: "1"
            - name: ISPWATCH_KUBELET_URL
              value: {{ .Values.ebpfTracing.kubeletURL | default "https://localhost:10250" | quote }}
            - name: ISPWATCH_KUBELET_TOKEN_FILE
              value: "/var/run/secrets/kubernetes.io/serviceaccount/token"
            - name: ISPWATCH_KUBELET_INSECURE
              value: {{ .Values.ebpfTracing.kubeletInsecure | default "1" | quote }}
            {{- end }}
            {{- if .Values.profiling.enabled }}
            # Profiler contínuo de CPU (eBPF perf_event → flame graph por
            # pod/serviço no portal). Só tem efeito no modo ingest.
            - name: ISPWATCH_PROFILING_ENABLED
              value: "1"
            {{- end }}
            {{- if .Values.sbomScan.enabled }}
            # Vulnerabilidade de aplicação (camada 2/3): Trivy gera o SBOM das
            # imagens rodando e o agent manda a lista pro gateway (/sbom).
            - name: ISPWATCH_SBOM_SCAN
              value: "1"
            - name: ISPWATCH_SBOM_INTERVAL
              value: {{ .Values.sbomScan.interval | default "1h" | quote }}
            - name: ISPWATCH_SBOM_CONTAINERD_ADDR
              value: {{ .Values.sbomScan.containerdAddr | default "/run/containerd/containerd.sock" | quote }}
            {{- with .Values.sbomScan.trivyArgs }}
            - name: ISPWATCH_SBOM_TRIVY_ARGS
              value: {{ . | quote }}
            {{- end }}
            # Trivy escreve cache em /tmp (emptyDir gravável; rootfs é RO no default).
            - name: TRIVY_CACHE_DIR
              value: "/tmp/trivy-cache"
            {{- end }}
          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: sys
              mountPath: /host/sys
              readOnly: true
            - name: wal
              mountPath: /var/lib/ispwatch-collector
            - name: tmp
              mountPath: /tmp
            # machine-id do HOST (dedup por machine-id: funde o nó com o agente
            # Linux do MESMO box físico numa máquina só). Em container o
            # /etc/machine-id é o do container — por isso o host vem montado aqui.
            - name: machineid
              mountPath: /host/etc/machine-id
              readOnly: true
            {{- if .Values.logs.enabled }}
            # Logs de pod (CRI). /var/log/pods tem os arquivos reais de log
            # de todos os pods do nó; read-only basta.
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            {{- end }}
            {{- if .Values.ebpfTracing.enabled }}
            # eBPF precisa de /sys/kernel/debug (kprobes) + /sys/fs/bpf
            # (BPF maps persistentes). Read-only quando o kernel suporta;
            # alguns kernels antigos exigem RW pra criar tracefs events.
            - name: debugfs
              mountPath: /sys/kernel/debug
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            {{- end }}
            {{- if .Values.sbomScan.enabled }}
            # Trivy lê o store de imagens via o socket do containerd do nó (RO).
            - name: containerd-sock
              mountPath: {{ .Values.sbomScan.containerdAddr | default "/run/containerd/containerd.sock" }}
              readOnly: true
            {{- end }}
          resources:
            {{- if or .Values.ebpfTracing.enabled .Values.profiling.enabled }}
            {{- toYaml .Values.resourcesEbpf | nindent 12 }}
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
          securityContext:
            {{- if or .Values.ebpfTracing.enabled .Values.profiling.enabled }}
            # eBPF exige privileged ou capabilities específicas. Privileged
            # é mais simples e compatível com kernel/distro diversos —
            # tradeoff: o agent já roda como hostNetwork+hostPID, escopo
            # de impacto similar.
            privileged: true
            # eBPF kprobes/perf_event precisam de CAP_SYS_ADMIN, e o image
            # USER do Dockerfile (ispwatch uid 10001) não tem capabilities
            # mesmo com privileged. Override pra root só quando eBPF ativo.
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
            {{- else if .Values.sbomScan.enabled }}
            # Trivy precisa ler o socket do containerd (root:root) e escrever cache
            # em /tmp. Roda como root SEM privileged — escopo só do store de imagens.
            runAsUser: 0
            runAsGroup: 0
            readOnlyRootFilesystem: false
            allowPrivilegeEscalation: false
            {{- else }}
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_RAW"]   # ICMP ping check needs raw sockets
            {{- end }}
      volumes:
        - name: proc
          hostPath:
            path: /proc
        - name: sys
          hostPath:
            path: /sys
        - name: wal
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: machineid
          hostPath:
            path: /etc/machine-id
            type: File
        {{- if .Values.logs.enabled }}
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        {{- end }}
        {{- if .Values.ebpfTracing.enabled }}
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: DirectoryOrCreate
        {{- end }}
        {{- if .Values.sbomScan.enabled }}
        - name: containerd-sock
          hostPath:
            path: {{ .Values.sbomScan.containerdAddr | default "/run/containerd/containerd.sock" }}
            type: Socket
        {{- end }}
