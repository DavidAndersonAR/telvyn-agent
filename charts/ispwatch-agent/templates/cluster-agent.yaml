{{- if .Values.clusterAgent.enabled }}
{{- /*
  Cluster Agent (modo ISPWATCH_AGENT_KIND=k8s.cluster): 1 réplica que fala com
  o API server in-cluster e faz LIST dos Events do cluster inteiro (OOMKilled,
  BackOff, FailedScheduling, Unhealthy…) → push certless pro noc_k8s_event
  (timeline na cluster page). Visão cross-node que o DaemonSet (kubelet local)
  não alcança.

  Segurança: SA/ClusterRole/Binding DEDICADOS -cluster (blast radius separado do
  node-agent), RBAC mínimo READ-ONLY cluster-wide. Deployment endurecido — SEM
  hostPath/hostNetwork/hostPID, runAsNonRoot, readOnlyRootFilesystem, drop ALL.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ispwatch-agent.clusterLabels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-cluster
  labels:
    {{- include "ispwatch-agent.clusterLabels" . | nindent 4 }}
rules:
  # Least-privilege: concede só o que o cluster-agent realmente chama.
  # - events: timeline de eventos (F2).
  # - pods: kube-state (contagem por namespace/fase → k8s.namespace.pod_count).
  # - apps/deployments: saúde de workload (réplicas desired/ready/available).
  - apiGroups: [""]
    resources: ["events", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-cluster
  labels:
    {{- include "ispwatch-agent.clusterLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ispwatch-agent.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "ispwatch-agent.fullname" . }}-cluster
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ispwatch-agent.fullname" . }}-cluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ispwatch-agent.clusterLabels" . | nindent 4 }}
spec:
  # 1 réplica (singleton) — HA/leader-election fica pra próxima leva.
  replicas: 1
  selector:
    matchLabels:
      {{- include "ispwatch-agent.clusterSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ispwatch-agent.clusterSelectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "ispwatch-agent.fullname" . }}-cluster
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # O binário do agent é marcado com CAP_NET_RAW (necessário pro
              # check icmp.ping do DaemonSet). O kernel RECUSA o exec de um
              # binário marcado quando a capability não está disponível — sem
              # esta linha o pod não sobe ("exec: operation not permitted").
              # O cluster-agent não abre socket cru; isto é só pra executar.
              add: ["NET_RAW"]
          env:
            # Certless (mesmo gateway do DaemonSet): OTLP+Bearer, sem mTLS.
            - name: ISPWATCH_INGEST_URL
              value: {{ required "values.ingest.url é obrigatório p/ o cluster-agent" .Values.ingest.url | quote }}
            - name: ISPWATCH_INGEST_TOKEN
              value: {{ required "values.ingest.token é obrigatório p/ o cluster-agent" .Values.ingest.token | quote }}
            # Modo cluster: dispara o branch k8s.cluster (LIST de events no API server).
            - name: ISPWATCH_AGENT_KIND
              value: "k8s.cluster"
            - name: ISPWATCH_CLUSTER
              value: {{ .Values.clusterName | quote }}
            - name: ISPWATCH_CLUSTER_INTERVAL_SEC
              value: {{ .Values.clusterAgent.intervalSeconds | quote }}
            {{- if .Values.clusterAgent.includeNormalEvents }}
            - name: ISPWATCH_CLUSTER_EVENTS_INCLUDE_NORMAL
              value: "1"
            {{- end }}
            - name: ISPWATCH_K8S_INSECURE
              value: {{ .Values.clusterAgent.apiInsecure | quote }}
            # Não registra collector nem roda checagens agendadas — só eventos.
            - name: ISPWATCH_CHECKS_ENABLED
              value: "0"
            - name: COLLECTOR_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: state, mountPath: /var/lib/ispwatch-collector }
          resources:
            {{- toYaml .Values.clusterAgent.resources | nindent 12 }}
      volumes:
        # readOnlyRootFilesystem=true — escrituras eventuais vão pra emptyDir.
        - { name: tmp, emptyDir: {} }
        - { name: state, emptyDir: {} }
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clusterAgent.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
{{- end }}
