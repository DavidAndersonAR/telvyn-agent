name: publish

# Publica a imagem multi-arch do Telvyn Agent no GHCR e o chart Helm como
# artefato OCI. Dispara em tags v* (ex: v0.1.0) ou manualmente.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem o v à frente)'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve vars
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "::error::versão '$v' inválida"; exit 1
          fi
          # Tag de SÉRIE, no modelo do Datadog (`agent:7`): uma tag móvel que
          # anda dentro da faixa compatível, pra quem quer correção sem pular
          # de major sem querer. Em 0.x quem marca compatibilidade é o MINOR
          # (0.4.8 → série "0.4"), não o major.
          # `latest` continua saindo, mas é a que leva pra qualquer coisa
          # publicada — não é a que a gente recomenda em instalação.
          series=""
          if printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            major="${v%%.*}"; rest="${v#*.}"; minor="${rest%%.*}"
            if [ "$major" = "0" ]; then series="0.$minor"; else series="$major"; fi
          fi
          # A lista de tags sai pronta daqui em vez de montada em expressão do
          # Actions: sem série, a expressão deixaria uma linha vazia no input.
          img="ghcr.io/$owner/telvyn-agent"
          {
            echo "tags<<EOF_TAGS"
            echo "$img:$v"
            [ -n "$series" ] && echo "$img:$series"
            echo "$img:latest"
            echo "EOF_TAGS"
          } >> "$GITHUB_OUTPUT"
          echo "owner=$owner"     >> "$GITHUB_OUTPUT"
          echo "version=$v"       >> "$GITHUB_OUTPUT"
          echo "series=$series"   >> "$GITHUB_OUTPUT"
          echo "Owner=$owner version=$v series=${series:-<nenhuma>}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image (amd64/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          provenance: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Package + push chart (OCI)
        run: |
          helm package charts/ispwatch-agent \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push ispwatch-agent-*.tgz \
            "oci://ghcr.io/${{ steps.vars.outputs.owner }}/charts"
