name: publish

# Publica a imagem multi-arch do Telvyn Agent no GHCR e o chart Helm como
# artefato OCI. Dispara em tags v* (ex: v0.1.0) ou manualmente.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (sem o v à frente)'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve vars
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.event_name }}" = "push" ]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="${{ github.event.inputs.version }}"
          fi
          if ! printf '%s' "$v" | grep -Eq '^[0-9A-Za-z._-]+$'; then
            echo "::error::versão '$v' inválida"; exit 1
          fi
          echo "owner=$owner"     >> "$GITHUB_OUTPUT"
          echo "version=$v"       >> "$GITHUB_OUTPUT"
          echo "Owner=$owner version=$v"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push image (amd64/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.owner }}/telvyn-agent:${{ steps.vars.outputs.version }}
            ghcr.io/${{ steps.vars.outputs.owner }}/telvyn-agent:latest
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
          provenance: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Package + push chart (OCI)
        run: |
          helm package charts/ispwatch-agent \
            --version "${{ steps.vars.outputs.version }}" \
            --app-version "${{ steps.vars.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push ispwatch-agent-*.tgz \
            "oci://ghcr.io/${{ steps.vars.outputs.owner }}/charts"
